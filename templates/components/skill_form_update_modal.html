<div id="update-skill-modal"
     class="skill-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="update-skill-modal-title">
    <button type="button"
            class="skill-form-modal__backdrop"
            popovertarget="update-skill-modal"
            popovertargetaction="hide"
            aria-label="Tutup form update skill"></button>

    <div class="skill-form-modal__content">
        <button type="button"
                class="skill-form-modal__close"
                popovertarget="update-skill-modal"
                popovertargetaction="hide"
                aria-label="Tutup form update skill">×</button>

        <h2 id="update-skill-modal-title">Update Skill</h2>
        <form id="update-skill-form" method="post" action="" class="skill-form">
            {% csrf_token %}
            {% for field in update_form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <div class="skill-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="update-skill-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>
